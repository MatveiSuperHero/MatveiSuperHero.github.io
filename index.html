<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ToolBox — Бесплатные онлайн инструменты</title>
    <meta name="description" content="Бесплатные онлайн-инструменты: генератор паролей, форматирователь JSON, счётчик слов, Base64, хеш SHA-256, генератор QR-кодов.">
    <script>window.yaContextCb=window.yaContextCb||[]</script>
    <script src="https://yandex.ru/ads/system/context.js" async></script>
    <style>
        :root{--bg:#0f1115;--card:#171a21;--accent:#4f8cff;--text:#e6e9ef;--muted:#8b93a5}
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
        header{padding:40px 16px 20px;text-align:center}
        h1{font-size:1.8rem;margin-bottom:8px}
        header p{color:var(--muted);font-size:0.95rem}
        nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:10px;border-bottom:1px solid #2a2f3a;margin-bottom:30px}
        nav button{background:var(--card);border:1px solid #2a2f3a;color:var(--text);padding:10px 16px;border-radius:8px;cursor:pointer;font-size:.9rem;transition: all 0.2s}
        nav button:hover{border-color:var(--accent)}
        nav button.active{background:var(--accent);border-color:var(--accent)}
        main{max-width:860px;margin:0 auto;padding:0 16px 60px}
        .tool{display:none;background:var(--card);border:1px solid #2a2f3a;border-radius:14px;padding:24px;box-shadow:0 4px 20px rgba(0,0,0,0.2)}
        .tool.active{display:block}
        .tool h2{font-size:1.25rem;margin-bottom:20px;color:var(--accent)}
        label{display:block;font-size:.85rem;color:var(--muted);margin:10px 0 6px}
        input,textarea,select{width:100%;background:#0f1115;border:1px solid #2a2f3a;color:var(--text);padding:12px;border-radius:8px;font-size:.95rem;outline:none}
        input:focus,textarea:focus{border-color:var(--accent)}
        textarea{min-height:150px;font-family:ui-monospace,monospace;resize:vertical}
        .btn{background:var(--accent);border:0;color:#fff;padding:12px 20px;border-radius:8px;cursor:pointer;font-size:.95rem;margin-top:15px;font-weight:600}
        .btn:hover{opacity:0.9}
        .btn.secondary{background:#2a2f3a}
        .btn.secondary:hover{background:#3a4152}
        .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:15px}
        .out{background:#0f1115;border:1px dashed #2a2f3a;padding:15px;border-radius:8px;margin-top:15px;font-family:ui-monospace,monospace;word-break:break-all;min-height:42px;display:flex;align-items:center;justify-content:center;font-size:0.9rem}
        .stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:15px}
        .stats div{background:#0f1115;padding:12px;border-radius:8px;text-align:center;flex:1;min-width:100px}
        .stats b{display:block;font-size:1.2rem;color:var(--accent)}
        label.chk{display:inline-flex;gap:8px;align-items:center;width:auto;font-size:0.85rem}
        canvas#qr-canvas{max-width:100%;height:auto;border:1px solid #2a2f3a;border-radius:8px;background:#fff;padding:5px;margin:10px 0}
        .ad-container{margin:30px 0;min-height:90px}
    </style>
</head>
<body>
<header>
    <h1>⚡ Быстрые инструменты</h1>
    <p>Бесплатные онлайн-инструменты для разработчиков и пользователей</p>
</header>

<nav id="nav">
    <button class="active" data-t="pw">🔐 Пароли</button>
    <button data-t="json">🧩 JSON</button>
    <button data-t="text">📝 Счётчик текста</button>
    <button data-t="b64">🔄 Base64</button>
    <button data-t="hash">🛡 SHA-256</button>
    <button data-t="qr">📷 QR-код</button>
</nav>

<main>
    <div id="yandex_rtb_R-A-20456192-1" class="ad-container"></div>

    <section class="tool active" id="pw">
        <h2>Генератор паролей</h2>
        <label>Длина пароля:</label>
        <input type="range" min="6" max="64" value="16" id="pwrange">
        <div class="row">
            <label class="chk"><input type="checkbox" id="up" checked> A-Z</label>
            <label class="chk"><input type="checkbox" id="low" checked> a-z</label>
            <label class="chk"><input type="checkbox" id="num" checked> 0-9</label>
            <label class="chk"><input type="checkbox" id="spec" checked> !@#$</label>
        </div>
        <button class="btn" onclick="genPw()">Сгенерировать пароль</button>
        <div class="out" id="pwout">—</div>
        <button class="btn secondary" onclick="copyEl('pwout')">Копировать в буфер</button>
    </section>

    <section class="tool" id="json">
        <h2>Форматирователь JSON</h2>
        <textarea id="jsonin" placeholder='Вставьте JSON сюда...'></textarea>
        <div class="row">
            <button class="btn" onclick="fmtJson(true)">Красивый вид</button>
            <button class="btn secondary" onclick="fmtJson(false)">Минифицировать</button>
        </div>
        <div class="out" id="jsonout">—</div>
    </section>

    <section class="tool" id="text">
        <h2>Счётчик слов и символов</h2>
        <textarea id="textin" placeholder="Вставьте текст для анализа..."></textarea>
        <div class="stats">
            <div><b id="sChars">0</b>символов</div>
            <div><b id="sCharsNoSp">0</b>без пробелов</div>
            <div><b id="sWords">0</b>слов</div>
            <div><b id="sSents">0</b>предложений</div>
            <div><b id="sRead">0</b>мин чтения</div>
        </div>
    </section>

    <section class="tool" id="b64">
        <h2>Base64: Кодирование / Декодирование</h2>
        <textarea id="b64in" placeholder="Введите текст или Base64-строку..."></textarea>
        <div class="row">
            <button class="btn" onclick="b64enc()">→ Закодировать в Base64</button>
            <button class="btn secondary" onclick="b64dec()">← Декодировать из Base64</button>
        </div>
        <div class="out" id="b64out">—</div>
    </section>

    <section class="tool" id="hash">
        <h2>Хеш SHA-256</h2>
        <textarea id="hashin" placeholder="Введите текст для хеширования..."></textarea>
        <button class="btn" onclick="makeHash()">Сгенерировать хеш</button>
        <div class="out" id="hashout">—</div>
    </section>

    <section class="tool" id="qr">
        <h2>Генератор QR-кодов</h2>
        <label>Введите текст или ссылку:</label>
        <textarea id="qrin" placeholder="https://example.com"></textarea>
        <button class="btn" onclick="makeQR()">Сгенерировать QR-код</button>
        <div class="out" style="min-height: 220px; background: #171a21;">
            <canvas id="qr-canvas" width="256" height="256"></canvas>
        </div>
        <button class="btn secondary" onclick="downloadQR()">Скачать QR-код</button>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script>
    const $=id=>document.getElementById(id);

    // Навигация
    document.getElementById('nav').addEventListener('click',e=>{
        if(e.target.tagName!=='BUTTON')return;
        document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
        document.querySelectorAll('.tool').forEach(t=>t.classList.remove('active'));
        e.target.classList.add('active');
        document.getElementById(e.target.dataset.t).classList.add('active');
    });

    // Пароли
    $('pwrange').oninput=e=>{ $('pwlen').textContent=e.target.value; genPw(); };
    function genPw(){
        let s='';
        if($('up').checked)s+='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        if($('low').checked)s+='abcdefghijklmnopqrstuvwxyz';
        if($('num').checked)s+='0123456789';
        if($('spec').checked)s+='!@#$%^&*()-_=+';
        if(!s){$('pwout').textContent='Выберите хотя бы один набор символов';return;}
        const a=new Uint32Array(+$('pwrange').value); 
        crypto.getRandomValues(a);
        $('pwout').textContent=[...a].map(n=>s[n%s.length]).join('');
    }

    function copyEl(id){
        const el=$(id);
        if(el.textContent === '—') return;
        navigator.clipboard.writeText(el.textContent);
        const oldText = el.textContent;
        el.textContent = 'Скопировано ✓';
        setTimeout(()=>el.textContent=oldText, 1500);
    }

    // JSON
    function fmtJson(pretty){
        try{
            const input = $('jsonin').value;
            if(!input) return;
            const o=JSON.parse(input);
            $('jsonout').textContent=JSON.stringify(o,null,pretty?2:0);
        }catch(e){$('jsonout').textContent='Ошибка: '+e.message;}
    }

    // Счётчик
    $('textin').addEventListener('input',()=>{
        const t=$('textin').value;
        $('sChars').textContent=t.length;
        $('sCharsNoSp').textContent=t.replace(/\s/g,'').length;
        $('sWords').textContent=(t.trim().match(/\S+/g)||[]).length;
        $('sSents').textContent=(t.match(/[.!?…]+/g)||[]).length;
        $('sRead').textContent=Math.max(1,Math.ceil((t.trim().match(/\S+/g)||[]).length/200));
    });

    // Base64
    function b64enc(){
        try{
            const input = $('b64in').value;
            if(!input) return;
            $('b64out').textContent=btoa(unescape(encodeURIComponent(input)));
        }catch(e){$('b64out').textContent='Ошибка: '+e.message;}
    }
    function b64dec(){
        try{
            const input = $('b64in').value.trim();
            if(!input) return;
            $('b64out').textContent=decodeURIComponent(escape(atob(input)));
        }catch(e){$('b64out').textContent='Ошибка: Некорректная Base64 строка';}
    }

    // SHA-256
    async function makeHash(){
        const input = $('hashin').value;
        if(!input) return;
        const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(input));
        $('hashout').textContent=[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
    }

    // QR Code
    function makeQR(){
        const text = $('qrin').value;
        if(!text){alert('Введите текст или ссылку');return;}
        const canvas = $('qr-canvas');
        QRCode.toCanvas(canvas, text, {
            width: 256,
            margin: 2,
            color: { dark: '#000000', light: '#ffffff' }
        }).catch(err=>{
            console.error(err);
            $('qrin').textContent='Ошибка генерации';
        });
    }

    function downloadQR(){
        const canvas = $('qr-canvas');
        if(!canvas.toDataURL()){alert('Сначала сгенерируйте QR-код');return;}
        const link = document.createElement('a');
        link.download = 'qrcode.png';
        link.href = canvas.toDataURL();
        link.click();
    }

    // Инициализация
    genPw();
</script>
</body>
</html>
